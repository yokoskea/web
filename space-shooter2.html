<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スペースシューティングゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #gameContainer {
            position: relative;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        canvas {
            display: block;
            background: #0a0a1a;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #score {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #lives {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #f44;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            display: none;
            pointer-events: auto;
        }

        #gameOver h1 {
            font-size: 48px;
            color: #f44;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            margin-bottom: 20px;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #gameOver .final-score {
            font-size: 32px;
            color: #ff0;
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.5);
            margin-bottom: 30px;
        }

        #restartBtn {
            padding: 12px 40px;
            font-size: 20px;
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            pointer-events: auto;
        }

        #restartBtn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            pointer-events: auto;
        }

        #startScreen h1 {
            font-size: 42px;
            color: #0ff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            margin-bottom: 15px;
        }

        #startScreen p {
            font-size: 16px;
            color: #888;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        #startScreen .controls {
            margin: 20px 0;
            color: #aaa;
        }

        #startBtn {
            padding: 12px 40px;
            font-size: 20px;
            background: transparent;
            color: #0f0;
            border: 2px solid #0f0;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            pointer-events: auto;
            margin-top: 10px;
        }

        #startBtn:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        #wave {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="score">SCORE: 0</div>
            <div id="lives">♥♥♥</div>
            <div id="wave">WAVE 1</div>
            <div id="startScreen">
                <h1>🚀 SPACE SHOOTER</h1>
                <div class="controls">
                    <p>← →  or  A D  : 移動</p>
                    <p>SPACE  : ショット</p>
                    <p>P  : ポーズ</p>
                </div>
                <button id="startBtn">START GAME</button>
            </div>
            <div id="gameOver">
                <h1>GAME OVER</h1>
                <p class="final-score" id="finalScore">SCORE: 0</p>
                <p id="waveReached">WAVE 1</p>
                <button id="restartBtn">RESTART</button>
            </div>
        </div>
    </div>

    <script>
        // ===== Canvas Setup =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 600;
        const H = 800;
        canvas.width = W;
        canvas.height = H;

        // ===== DOM Elements =====
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const waveEl = document.getElementById('wave');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const waveReachedEl = document.getElementById('waveReached');
        const restartBtn = document.getElementById('restartBtn');

        // ===== Game State =====
        let gameState = 'start'; // start, playing, paused, gameover
        let score = 0;
        let lives = 3;
        let wave = 1;
        let frame = 0;
        let keys = {};
        let stars = [];

        // ===== Player =====
        const player = {
            x: W / 2,
            y: H - 80,
            w: 40,
            h: 40,
            speed: 5,
            shootCooldown: 0,
            shootDelay: 10,
            invincible: 0,
        };

        // ===== Bullets =====
        let bullets = [];
        const bulletSpeed = -8;
        const bulletW = 4;
        const bulletH = 14;

        // ===== Enemies =====
        let enemies = [];
        let enemyBullets = [];

        // ===== Particles =====
        let particles = [];

        // ===== Powerups =====
        let powerups = [];

        // ===== Stars Background =====
        function initStars() {
            stars = [];
            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: Math.random() * 2.5 + 0.5,
                    speed: Math.random() * 2 + 0.5,
                    brightness: Math.random() * 0.5 + 0.5,
                });
            }
        }
        initStars();

        // ===== Utility =====
        function rand(min, max) { return Math.random() * (max - min) + min; }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        function dist(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function rectCollide(a, b) {
            return a.x - a.w / 2 < b.x + b.w / 2 &&
                a.x + a.w / 2 > b.x - b.w / 2 &&
                a.y - a.h / 2 < b.y + b.h / 2 &&
                a.y + a.h / 2 > b.y - b.h / 2;
        }

        // ===== Particle System =====
        function spawnParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(1, 5);
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: rand(20, 50),
                    maxLife: 50,
                    size: rand(2, 5),
                    color,
                });
            }
        }

        function spawnExplosion(x, y, count = 30) {
            const colors = ['#f44', '#ff0', '#f80', '#fff', '#f0f'];
            for (let i = 0; i < count; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(2, 8);
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: rand(15, 40),
                    maxLife: 40,
                    size: rand(2, 6),
                    color: colors[randInt(0, colors.length - 1)],
                });
            }
        }

        // ===== Enemy Types =====
        const enemyTypes = {
            basic: {
                w: 30,
                h: 30,
                hp: 1,
                speed: 2,
                score: 100,
                color: '#f44',
                shootChance: 0.005,
            },
            fast: {
                w: 24,
                h: 24,
                hp: 1,
                speed: 4,
                score: 150,
                color: '#f80',
                shootChance: 0.008,
            },
            tank: {
                w: 40,
                h: 40,
                hp: 3,
                speed: 1.2,
                score: 300,
                color: '#a4f',
                shootChance: 0.01,
            },
            shooter: {
                w: 32,
                h: 32,
                hp: 2,
                speed: 1.5,
                score: 200,
                color: '#0ff',
                shootChance: 0.02,
            },
        };

        // ===== Spawn Enemies =====
        function spawnEnemy(type) {
            const t = enemyTypes[type];
            enemies.push({
                x: rand(t.w / 2, W - t.w / 2),
                y: -t.h,
                w: t.w,
                h: t.h,
                hp: t.hp,
                maxHp: t.hp,
                speed: t.speed,
                score: t.score,
                color: t.color,
                type: type,
                shootChance: t.shootChance,
                moveTimer: 0,
                moveDir: rand(-1, 1),
            });
        }

        function getWaveEnemies(waveNum) {
            const types = ['basic'];
            if (waveNum >= 2) types.push('fast');
            if (waveNum >= 3) types.push('shooter');
            if (waveNum >= 5) types.push('tank');

            const count = Math.min(5 + waveNum * 2, 25);
            const enemies = [];
            for (let i = 0; i < count; i++) {
                enemies.push(types[randInt(0, types.length - 1)]);
            }
            return enemies;
        }

        let waveEnemies = [];
        let waveSpawnIndex = 0;
        let waveSpawnTimer = 0;
        let waveDelay = 0;

        function startWave() {
            waveEnemies = getWaveEnemies(wave);
            waveSpawnIndex = 0;
            waveSpawnTimer = 0;
            waveDelay = 60;
            waveEl.textContent = `WAVE ${wave}`;
            waveEl.style.display = 'block';
        }

        function updateWave() {
            if (waveDelay > 0) {
                waveDelay--;
                return;
            }
            waveEl.style.display = 'none';

            if (waveSpawnIndex < waveEnemies.length) {
                waveSpawnTimer--;
                if (waveSpawnTimer <= 0) {
                    spawnEnemy(waveEnemies[waveSpawnIndex]);
                    waveSpawnIndex++;
                    waveSpawnTimer = Math.max(10, 30 - wave * 2);
                }
            } else if (enemies.length === 0) {
                // Wave cleared
                wave++;
                startWave();
            }
        }

        // ===== Powerups =====
        function spawnPowerup(x, y) {
            if (Math.random() < 0.12) {
                const types = ['rapid', 'spread', 'shield'];
                powerups.push({
                    x,
                    y,
                    w: 20,
                    h: 20,
                    type: types[randInt(0, types.length - 1)],
                    vy: 2,
                    timer: 600,
                });
            }
        }

        // ===== Input =====
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'p' || e.key === 'P') {
                if (gameState === 'playing') {
                    gameState = 'paused';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                }
            }
            if (e.key === ' ' && gameState === 'playing') {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // ===== Game Functions =====
        function shoot() {
            if (player.shootCooldown > 0) return;
            player.shootCooldown = player.shootDelay;

            const power = player.power || 'normal';

            if (power === 'spread') {
                for (let angle = -0.3; angle <= 0.3; angle += 0.15) {
                    bullets.push({
                        x: player.x,
                        y: player.y - player.h / 2,
                        w: bulletW,
                        h: bulletH,
                        vx: Math.sin(angle) * 3,
                        vy: bulletSpeed,
                        damage: 1,
                    });
                }
            } else if (power === 'rapid') {
                bullets.push({
                    x: player.x,
                    y: player.y - player.h / 2,
                    w: bulletW,
                    h: bulletH,
                    vx: 0,
                    vy: bulletSpeed * 1.3,
                    damage: 1,
                });
            } else {
                bullets.push({
                    x: player.x,
                    y: player.y - player.h / 2,
                    w: bulletW,
                    h: bulletH,
                    vx: 0,
                    vy: bulletSpeed,
                    damage: 1,
                });
            }
        }

        function enemyShoot(enemy) {
            const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            const speed = 3;
            enemyBullets.push({
                x: enemy.x,
                y: enemy.y + enemy.h / 2,
                w: 5,
                h: 5,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
            });
        }

        function resetGame() {
            score = 0;
            lives = 3;
            wave = 1;
            frame = 0;
            bullets = [];
            enemies = [];
            enemyBullets = [];
            particles = [];
            powerups = [];
            player.x = W / 2;
            player.y = H - 80;
            player.shootCooldown = 0;
            player.invincible = 0;
            player.power = 'normal';
            player.shootDelay = 10;
            player.powerTimer = 0;
            scoreEl.textContent = 'SCORE: 0';
            livesEl.textContent = '♥♥♥';
            gameOverEl.style.display = 'none';
            startScreen.style.display = 'none';
            waveEl.style.display = 'block';
            waveEl.textContent = 'WAVE 1';
            startWave();
            gameState = 'playing';
        }

        // ===== Update =====
        function update() {
            if (gameState !== 'playing') return;
            frame++;

            // --- Player Movement ---
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
            player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
            player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

            // --- Shooting ---
            if (keys[' '] || keys['Space']) {
                shoot();
            }
            if (player.shootCooldown > 0) player.shootCooldown--;

            // --- Powerup Timer ---
            if (player.powerTimer > 0) {
                player.powerTimer--;
                if (player.powerTimer === 0) {
                    player.power = 'normal';
                    player.shootDelay = 10;
                }
            }

            // --- Invincibility ---
            if (player.invincible > 0) player.invincible--;

            // --- Stars ---
            for (const star of stars) {
                star.y += star.speed;
                if (star.y > H) {
                    star.y = 0;
                    star.x = Math.random() * W;
                }
            }

            // --- Bullets ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.y < -20 || b.x < -20 || b.x > W + 20) {
                    bullets.splice(i, 1);
                }
            }

            // --- Enemies ---
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.moveTimer++;
                e.x += Math.sin(e.moveTimer * 0.03) * e.moveDir * 0.5;
                e.y += e.speed;

                // Shooting
                if (Math.random() < e.shootChance) {
                    enemyShoot(e);
                }

                if (e.y > H + 50) {
                    enemies.splice(i, 1);
                }
            }

            // --- Enemy Bullets ---
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) {
                    enemyBullets.splice(i, 1);
                }
            }

            // --- Collision: Bullets vs Enemies ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (rectCollide(
                            { x: b.x, y: b.y, w: b.w, h: b.h },
                            { x: e.x, y: e.y, w: e.w, h: e.h }
                        )) {
                        e.hp -= b.damage;
                        spawnParticles(b.x, b.y, '#ff0', 5);
                        bullets.splice(i, 1);
                        if (e.hp <= 0) {
                            score += e.score;
                            scoreEl.textContent = `SCORE: ${score}`;
                            spawnExplosion(e.x, e.y, 25);
                            spawnPowerup(e.x, e.y);
                            enemies.splice(j, 1);
                        }
                        break;
                    }
                }
            }

            // --- Collision: Enemy Bullets vs Player ---
            if (player.invincible === 0) {
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const b = enemyBullets[i];
                    if (rectCollide(
                            { x: player.x, y: player.y, w: player.w * 0.6, h: player.h * 0.6 },
                            { x: b.x, y: b.y, w: b.w, h: b.h }
                        )) {
                        enemyBullets.splice(i, 1);
                        playerHit();
                        break;
                    }
                }
            }

            // --- Collision: Enemies vs Player ---
            if (player.invincible === 0) {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    if (rectCollide(
                            { x: player.x, y: player.y, w: player.w * 0.6, h: player.h * 0.6 },
                            { x: e.x, y: e.y, w: e.w, h: e.h }
                        )) {
                        spawnExplosion(e.x, e.y, 20);
                        enemies.splice(i, 1);
                        playerHit();
                        break;
                    }
                }
            }

            // --- Powerups ---
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.vy;
                p.timer--;
                if (p.timer <= 0 || p.y > H + 20) {
                    powerups.splice(i, 1);
                    continue;
                }
                if (rectCollide(
                        { x: player.x, y: player.y, w: player.w, h: player.h },
                        { x: p.x, y: p.y, w: p.w, h: p.h }
                    )) {
                    if (p.type === 'rapid') {
                        player.power = 'rapid';
                        player.shootDelay = 5;
                        player.powerTimer = 600;
                    } else if (p.type === 'spread') {
                        player.power = 'spread';
                        player.shootDelay = 12;
                        player.powerTimer = 600;
                    } else if (p.type === 'shield') {
                        player.invincible = 300;
                    }
                    spawnParticles(p.x, p.y, '#0f0', 10);
                    powerups.splice(i, 1);
                }
            }

            // --- Particles ---
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.97;
                p.vy *= 0.97;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // --- Wave ---
            updateWave();
        }

        function playerHit() {
            if (player.invincible > 0) return;
            lives--;
            player.invincible = 90;
            spawnExplosion(player.x, player.y, 20);
            updateLivesDisplay();
            if (lives <= 0) {
                gameOver();
            }
        }

        function updateLivesDisplay() {
            livesEl.textContent = '♥'.repeat(Math.max(0, lives));
        }

        function gameOver() {
            gameState = 'gameover';
            finalScoreEl.textContent = `SCORE: ${score}`;
            waveReachedEl.textContent = `WAVE ${wave}`;
            gameOverEl.style.display = 'block';
        }

        // ===== Draw =====
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // --- Stars ---
            for (const star of stars) {
                const alpha = star.brightness * (0.5 + 0.5 * Math.sin(frame * 0.02 + star.x));
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- Particles ---
            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // --- Powerups ---
            for (const p of powerups) {
                const pulse = Math.sin(frame * 0.1) * 0.3 + 0.7;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0f0';

                // Glow
                ctx.fillStyle = `rgba(0, 255, 0, ${pulse * 0.3})`;
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();

                // Icon
                ctx.fillStyle = '#0f0';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const icons = { rapid: '⚡', spread: '✦', shield: '🛡' };
                ctx.fillText(icons[p.type] || '?', 0, 0);
                ctx.restore();
            }

            // --- Bullets ---
            for (const b of bullets) {
                const grad = ctx.createLinearGradient(b.x, b.y - b.h / 2, b.x, b.y + b.h / 2);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.3, '#0ff');
                grad.addColorStop(1, 'rgba(0, 255, 255, 0)');
                ctx.fillStyle = grad;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0ff';
                ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
                ctx.shadowBlur = 0;
            }

            // --- Enemy Bullets ---
            for (const b of enemyBullets) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f44';
                ctx.fillStyle = '#f44';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.w, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // --- Enemies ---
            for (const e of enemies) {
                ctx.save();
                ctx.translate(e.x, e.y);

                // Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = e.color;

                // Body
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, e.w / 2);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.3, e.color);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, e.w / 2, 0, Math.PI * 2);
                ctx.fill();

                // Shape based on type
                ctx.strokeStyle = e.color;
                ctx.lineWidth = 2;
                if (e.type === 'basic') {
                    // Triangle
                    ctx.beginPath();
                    ctx.moveTo(0, -e.h / 2);
                    ctx.lineTo(-e.w / 2, e.h / 2);
                    ctx.lineTo(e.w / 2, e.h / 2);
                    ctx.closePath();
                    ctx.stroke();
                } else if (e.type === 'fast') {
                    // Diamond
                    ctx.beginPath();
                    ctx.moveTo(0, -e.h / 2);
                    ctx.lineTo(e.w / 2, 0);
                    ctx.lineTo(0, e.h / 2);
                    ctx.lineTo(-e.w / 2, 0);
                    ctx.closePath();
                    ctx.stroke();
                } else if (e.type === 'tank') {
                    // Hexagon
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
                        const r = e.w / 2;
                        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    ctx.closePath();
                    ctx.stroke();
                } else if (e.type === 'shooter') {
                    // Pentagon
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                        const r = e.w / 2;
                        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }

                // HP bar for multi-HP enemies
                if (e.maxHp > 1) {
                    ctx.shadowBlur = 0;
                    const barW = e.w;
                    const barH = 4;
                    const barY = -e.h / 2 - 10;
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(-barW / 2, barY, barW, barH);
                    ctx.fillStyle = '#0f0';
                    ctx.fillRect(-barW / 2, barY, barW * (e.hp / e.maxHp), barH);
                }

                ctx.restore();
            }

            // --- Player ---
            if (gameState === 'playing' || gameState === 'paused') {
                ctx.save();
                ctx.translate(player.x, player.y);

                // Invincibility flash
                if (player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                // Shield effect
                if (player.invincible > 0) {
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#0ff';
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, player.w / 2 + 8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Engine glow
                const engineFlicker = Math.random() * 0.3 + 0.7;
                const grad = ctx.createRadialGradient(0, player.h / 2 + 5, 0, 0, player.h / 2 + 5, 20);
                grad.addColorStop(0, `rgba(0, 150, 255, ${engineFlicker})`);
                grad.addColorStop(0.5, `rgba(0, 100, 255, ${engineFlicker * 0.5})`);
                grad.addColorStop(1, 'rgba(0, 50, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, player.h / 2 + 5, 20, 0, Math.PI * 2);
                ctx.fill();

                // Ship body
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0af';

                // Main body
                ctx.fillStyle = '#0af';
                ctx.beginPath();
                ctx.moveTo(0, -player.h / 2);
                ctx.lineTo(-player.w / 2, player.h / 2);
                ctx.lineTo(-player.w / 4, player.h / 2 - 5);
                ctx.lineTo(0, player.h / 2 - 2);
                ctx.lineTo(player.w / 4, player.h / 2 - 5);
                ctx.lineTo(player.w / 2, player.h / 2);
                ctx.closePath();
                ctx.fill();

                // Cockpit
                ctx.fillStyle = 'rgba(150, 230, 255, 0.6)';
                ctx.beginPath();
                ctx.ellipse(0, -2, 8, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // --- Pause overlay ---
            if (gameState === 'paused') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', W / 2, H / 2);
                ctx.font = '18px Arial';
                ctx.fillText('Press P to resume', W / 2, H / 2 + 40);
            }
        }

        // ===== Game Loop =====
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ===== Event Listeners =====
        startBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', resetGame);

        // ===== Start =====
        gameLoop();
    </script>
</body>
</html>
